name: CI & Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before setup-node: the pnpm store cache needs `pnpm store path`.
      # Version comes from the packageManager field in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for vulnerabilities
        # No ignores: accept a real advisory only with a dated rationale.
        run: pnpm audit --audit-level=moderate --ignore-registry-errors

      - name: Lint
        # `biome ci` annotates the PR on GitHub; warnings fail CI too.
        run: pnpm exec biome ci src/ --error-on-warnings

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}

    steps:
      - name: Trigger Cloudflare Pages deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}
        run: |
          http_code=$(curl -sS --max-time 30 --retry 2 -o /tmp/deploy_response.txt -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL")
          echo "Cloudflare response: HTTP $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Deploy hook failed:"
            cat /tmp/deploy_response.txt
            exit 1
          fi
          echo "Deploy hook triggered successfully"

      # The hook only queues a build of the branch head: wait until production
      # serves this commit (build.txt, written by astro.config.mjs), then smoke
      # test it. A newer push cancels this run (concurrency group), so a
      # mismatch after the deadline means the deploy failed or is stuck.
      - name: Verify production deploy
        env:
          SITE: https://sergiomarquez.dev
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          deadline=$((SECONDS + 420))
          until [ "$(curl -sS --max-time 10 "$SITE/build.txt?t=$SECONDS" | tr -d '[:space:]')" = "$EXPECTED_SHA" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Production still does not serve $EXPECTED_SHA after 7 minutes"
              exit 1
            fi
            sleep 15
          done
          echo "Production serves $EXPECTED_SHA"
          check() {
            got=$(curl -sS --max-time 10 -o /dev/null -w "%{http_code}" "$SITE$1")
            echo "$1 -> $got"
            [ "$got" = "$2" ]
          }
          check / 200
          check /en/ 200
          check /yt 302
          check /this-page-does-not-exist 404
