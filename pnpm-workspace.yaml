allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - http-cache-semantics@4.3.0
overrides:
  # astro > vite > postcss pins nanoid <3.3.18, vulnerable to infinite loop with size 0 (GHSA-mwcw-c2x4-8c55)
  nanoid: '>=3.3.19 <4'
  # @astrojs/check > @astrojs/language-server > volar-service-* pins fast-uri <3.1.6, multiple host-confusion/SSRF advisories
  fast-uri: '>=3.1.8 <4'
  # astro > @astrojs/internal-helpers pins js-yaml 4.3.1, vulnerable to CPU exhaustion via merge keys (GHSA-2883-xcg3-v3hh)
  js-yaml: '>=4.3.2 <5'
  # astro pins devalue <5.9.1, vulnerable to DoS via malformed input (GHSA-9rgm-9g3h-6x36)
  devalue: '>=5.9.4 <6'
  # astro pins http-cache-semantics <=4.2.0, which can disclose cross-user cached responses (GHSA-ch52-4w7c-c8xp)
  http-cache-semantics: '>=4.2.1 <5'
